name: Importer bug
description: Report an importer, schema or publication defect using synthetic data.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities or publication integrity failures, use [private reporting](https://github.com/Memrov/PentCloud-scopes/security/advisories/new).
        Do not include credentials, private program details, sensitive target data, target inventories or scan results. Use synthetic examples; do not scan third-party targets to reproduce this issue.
  - type: input
    id: revision
    attributes:
      label: Affected revision and environment
      description: Code or catalog commit SHA, Python version and operating system, as relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the defect without posting real target data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Provide commands and a small invented fixture. Redact secrets and personal information from logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This report contains no credentials, private program details, sensitive target data or scan results, and does not disclose a vulnerability.
          required: true
